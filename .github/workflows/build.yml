name: Build and check
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile every version that exists
        run: |
          for v in 1 2 3 4 5 6; do
            f="v$v/v$v.c"
            if [ -f "$f" ]; then
              echo "Compiling $f"
              gcc -Wall -Wextra -std=c99 -o "/tmp/v$v" "$f" -lm
            fi
          done

      - name: Check that no version uses later constructs
        run: bash scripts/check_constructs.sh
