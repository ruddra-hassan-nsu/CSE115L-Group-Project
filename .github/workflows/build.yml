name: Compile check
on: [push, pull_request]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile every .c file in the version folders
        run: |
          status=0
          for f in v*/*.c; do
            [ -f "$f" ] || continue
            echo "Compiling $f"
            if ! gcc -Wall -std=c99 -o /tmp/test_build "$f" -lm; then
              echo "::error file=$f::This file does not compile. Read the messages above."
              status=1
            fi
          done
          exit $status
